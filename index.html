<!DOCTYPE html>
<html>
<head>
  <title>Tree Watering Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
    
    /* MAP CONTAINER */
    .map-container { position: relative; width: 100%; max-width: 600px; margin-bottom: 20px; }
    .map-img { width: 100%; display: block; border-radius: 8px; }
    
    /* LABELS (Overlay on map) */
    .zone-label {
      position: absolute;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      transform: translate(-50%, -50%);
    }
    /* Estimated Positions - Adjust percentages to match your image perfectly */
    #label-a { top: 20%; left: 15%; }
    #label-b { top: 15%; left: 40%; }
    #label-c { top: 60%; left: 30%; }
    #label-d { top: 70%; left: 60%; }

    /* TABLE STYLES */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #f2f2f2; }
    
    /* FORM STYLES */
    .update-form { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-top: 30px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #45a049; }
    button:disabled { background-color: #ccc; }
  </style>
</head>
<body>

  <h1>🌳 RRC Tree Watering Tracker</h1>

  <div class="map-container">
    <img src="./RRC patches.jpg" alt="Map" class="map-img">
    <div id="label-a" class="zone-label">Zone A</div>
    <div id="label-b" class="zone-label">Zone B</div>
    <div id="label-c" class="zone-label">Zone C</div>
    <div id="label-d" class="zone-label">Zone D</div>
  </div>

  <h3>Current Status</h3>
  <table>
    <thead>
      <tr>
        <th>Zone</th>
        <th>Last Watered</th>
        <th>Watered By</th>
      </tr>
    </thead>
    <tbody id="status-body">
      <tr><td colspan="3">Loading data...</td></tr>
    </tbody>
  </table>

  <div class="update-form">
    <h3>I watered a tree! 💧</h3>
    <div class="form-group">
      <label>Which Zone?</label>
      <select id="input-zone">
        <option value="A">Zone A</option>
        <option value="B">Zone B</option>
        <option value="C">Zone C</option>
        <option value="D">Zone D</option>
      </select>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="input-date">
    </div>
    <div class="form-group">
      <label>Your Name/Initials</label>
      <input type="text" id="input-name" placeholder="e.g. JB">
    </div>
    <button id="submit-btn" onclick="submitData()">Submit Update</button>
  </div>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbxkE0P8dfS8QqkRqCKzznI8NpgmuMXd1pjHATZSIPP1baDidx96ULacygk0DOv2DvLq/exec";

    function formatDate(dateString) {
      // 1. Handle empty or invalid dates
      if (!dateString || dateString === 'N/A' || dateString === '-') return '-';
      
      // 2. Create the date object
      const date = new Date(dateString);
      
      // 3. Format as MM/DD/YYYY
      return date.toLocaleDateString('en-US', { 
        year: 'numeric',   // "2025"
        month: '2-digit',  // "12" (instead of "Dec")
        day: '2-digit',    // "30" (adds a leading zero if needed, e.g., "05")
        timeZone: 'UTC'    // Keeps the date exact
      });
    }
    
    // Set today's date as default
    document.getElementById('input-date').valueAsDate = new Date();

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        const tbody = document.getElementById('status-body');
        tbody.innerHTML = ""; // Clear loading text
        
        ['A', 'B', 'C', 'D'].forEach(zone => {
          const info = data[zone] || {date: '-', by: '-'};
          const row = `<tr>
        <td><strong>Zone ${zone}</strong></td>
        <td>${formatDate(info.date)}</td>   <-- NEW CODE
        <td>${info.by}</td>
      </tr>`;
          tbody.innerHTML += row;
        });
      } catch (e) {
        console.error(e);
        document.getElementById('status-body').innerHTML = "<tr><td colspan='3'>Error loading data.</td></tr>";
      }
    }

    async function submitData() {
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "Saving...";

      const payload = {
        zone: document.getElementById('input-zone').value,
        date: document.getElementById('input-date').value,
        name: document.getElementById('input-name').value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        alert("Thank you for watering!");
        loadData(); // Refresh table
        document.getElementById('input-name').value = ""; // Clear name
      } catch (e) {
        alert("Error saving data.");
      }
      
      btn.disabled = false;
      btn.innerText = "Submit Update";
    }

    // Load data on page start
    loadData();
  </script>

</body>

</html>
